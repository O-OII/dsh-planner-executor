<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS 执行状态对比</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#183047;font:15px/1.6 system-ui,sans-serif}main{width:1120px;max-width:100%;margin:auto;padding:28px}h1{margin:0;font-size:26px}header p{margin:5px 0 22px;color:#587086}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #d9e2ee;border-radius:15px;overflow:hidden}.card h2{font-size:18px;margin:20px 20px 4px}.card p{margin:0 20px 8px;min-height:48px;color:#587086;font-size:13px}iframe{display:block;width:100%;height:340px;border:0}footer{font-size:12px;color:#62778c;margin-top:14px}@media(max-width:700px){.cards{grid-template-columns:1fr}}
</style></head><body><main><header><h1 id="title">DS 执行：由你决定何时开启</h1><p id="intro">活动面板可独立使用；路由只影响后续匹配的新委派。</p></header><section class="cards" id="cards"></section><footer id="note">公开合成演示 · 真实生产组件 · 不连接真实会话或调用模型</footer></main><script>
const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh-CN';
if(lang==='en'){document.documentElement.lang='en';document.querySelector('#title').textContent='DS execution: choose when to enable it';document.querySelector('#intro').textContent='Use the panel on its own; routing changes future matching delegations only.';document.querySelector('#note').textContent='Public synthetic demo · Actual production components · No real sessions or model calls';}
const labels=lang==='en'?[['off','OFF','Native DSH inheritance or explicit child selection.'],['on','ON','New matching delegations use the configured target.'],['unconfigured','Not configured','Set parent conditions and a target before enabling.']]:[['off','关闭','遵循 DSH 原生继承或显式子代理选模。'],['on','开启','后续匹配的新委派使用已配置的执行目标。'],['unconfigured','未配置','先设置主模型条件和执行目标，才能开启。']];
for(const [state,title,description]of labels){const card=document.createElement('article');card.className='card';const heading=document.createElement('h2');heading.textContent=title;const p=document.createElement('p');p.textContent=description;const frame=document.createElement('iframe');frame.title=title;frame.src='./index.html?lang='+lang+'&state='+state;frame.addEventListener('load',()=>{const doc=frame.contentDocument;doc.querySelector('main').style.display='none';doc.body.style.background='transparent';const position=()=>{const panel=doc.querySelector('[data-subagent-activity="panel"]');if(!panel)return false;Object.assign(panel.style,{top:'14px',left:'14px',right:'auto',width:'300px',maxHeight:'none'});if(panel.lastElementChild)panel.lastElementChild.style.maxHeight='none';return true;};if(!position()){const observer=new MutationObserver(()=>{if(position())observer.disconnect()});observer.observe(doc.body,{childList:true,subtree:true});}});card.append(heading,p,frame);document.querySelector('#cards').append(card);}
</script></body></html>
